
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
[project]
name = "india-rainfall-postprocessing"
version = "1.0.0"
description = "Regime-aware rainfall post-processing and verification framework for India"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.24.0,<2.0",
  "pandas>=2.0.0,<2.3.0",
  "scikit-learn>=1.3.0,<1.5.0",
  "xarray>=2023.1.0",
  "joblib>=1.3.0",
  "matplotlib>=3.7.0",
  "requests>=2.28.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
