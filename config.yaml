project:
  name: "India Rainfall Forecast Post-Processing"
  version: "1.0.0"

paths:
  base: "."
  imd_grd_dir: "./data/imd"
  imd_csv: "./data/imd_rainfall_2016_2025.csv"
  imd_districts: "./data/district_daily_rainfall_2016_2025.csv"
  grid_mapping: "./data/grid_to_district.csv"
  reanalysis_dir: "./data/reanalysis"
  regimes_dir: "./data/regimes"
  gefs_dir: "./data/gefs"
  gefs_india: "./data/gefs_india_2016_2019.csv"
  herbie_cache: "./cache"
  district_geojson: "./data/admin/district_simplified.geojson"
  models_dir: "./models"
  reports_dir: "./reports"

thresholds:
  heavy: 64.5
  very_heavy: 115.6
  extremely_heavy: 204.5
  dry_threshold: 0.1
  light: 2.5
  moderate: 20.0

spatial:
  imd_grid_lat_min: 6.5
  imd_grid_lat_max: 38.5
  imd_grid_lon_min: 66.5
  imd_grid_lon_max: 100.0
  imd_grid_resolution: 0.25
  imd_grid_nlat: 129
  imd_grid_nlon: 135
  india_lat_min: 5.0
  india_lat_max: 40.0
  india_lon_min: 60.0
  india_lon_max: 105.0
  aggregation_method: "mean_of_valid_grid_cells"
  fss_neighborhoods: [1, 3, 5, 7, 9]

temporal:
  train_period: ["2016-06-01", "2016-07-15"]
  val_period:   ["2016-07-16", "2016-07-25"]
  test_period:  ["2016-07-26", "2016-08-31"]
  monsoon_months: [6, 7, 8, 9]
  rolling_anomaly_window: 30

regimes:
  labels:
    - active_monsoon
    - break_monsoon
    - low_depression
    - coastal_rainfall
    - orographic_rainfall
    - western_disturbance
    - quiet
  min_samples_per_regime: 3

models:
  regime_classifier:
    algorithm: "RandomForestClassifier"
    n_estimators: 300
    class_weight: "balanced_subsample"
    random_state: 42
    min_samples_leaf: 1
    stratify: true
  bias_correction:
    algorithm: "RandomForestRegressor"
    n_estimators: 400
    random_state: 42
    min_samples_leaf: 2
    log_target: true
    quantile_mapping: true
  heavy_probability:
    algorithm: "HistGradientBoostingClassifier"
    max_iter: 300
    learning_rate: 0.05
    max_depth: 6
    random_state: 42

api:
  host: "127.0.0.1"
  port: 8000