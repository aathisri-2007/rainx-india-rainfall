name: Daily Forecast Refresh

on:
  schedule:
    # 03:00 UTC = 08:30 IST, every day
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas numpy scikit-learn joblib requests pyyaml
          pip install shapely pyproj
          pip install xarray cfgrib eccodes herbie-data

      - name: Fetch today's GFS forecast
        run: python fetch_realtime.py

      - name: Compute per-district regimes
        run: python compute_district_regimes_live.py

      - name: Commit and push
        run: |
          git config user.name "RainX Auto"
          git config user.email "actions@github.com"
          git add reports/realtime_forecast.csv
          git diff --staged --quiet || git commit -m "Auto-refresh: $(date +%Y-%m-%d)"
          git push